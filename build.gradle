plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'neo4j-gspatial'
version = '1.1.0'
description = 'Spatial Operations/Indexing in Neo4j by wkt/wkb from geometries'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven {
        name = 'osgeo'
        url = 'https://repo.osgeo.org/repository/release/'
    }
    mavenCentral()
}

ext {
    geotoolsVersion = '33.0'
    neo4jVersion = '2025.07.0'
    neo4jJavaVersion = '5.28.7'
    jtsCoreVersion = '1.20.0'
    junitVersion = '4.13.1'
    junitJupiterVersion = '5.13.1'
    jsonSimpleVersion = '1.1.1'
    commonsCsvVersion = '1.14.0'
    kryoVersion = '5.6.2'
}

dependencies {
    // Neo4j (provided scope equivalent)
    compileOnly "org.neo4j:neo4j:${neo4jVersion}"

    // JTS Core
    implementation "org.locationtech.jts:jts-core:${jtsCoreVersion}"

    // GeoTools
    implementation "org.geotools:gt-main:${geotoolsVersion}"
    implementation "org.geotools:gt-geojson:${geotoolsVersion}"

    // JSON Simple
    implementation "com.googlecode.json-simple:json-simple:${jsonSimpleVersion}"

    // Apache Commons CSV
    implementation "org.apache.commons:commons-csv:${commonsCsvVersion}"

    // Kryo
    implementation "com.esotericsoftware.kryo:kryo5:${kryoVersion}"

    // Test dependencies
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"
    testImplementation "org.neo4j.test:neo4j-harness:${neo4jVersion}"
    testImplementation "org.neo4j.driver:neo4j-java-driver:${neo4jJavaVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    maxHeapSize = '2g'
}

shadowJar {
    archiveBaseName.set('neo4j-gspatial')
    archiveClassifier.set('')
    
    // Relocations
    relocate 'org.example', 'shaded.org.example'
    
    // Excludes (equivalent to maven-shade-plugin filters)
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'about.html'
    exclude 'plugin.properties'
    exclude 'plugin.xml'
    exclude 'META-INF/LICENSE.txt'
    exclude 'META-INF/NOTICE.txt'
    exclude 'META-INF/services/javax.measure.spi.ServiceProvider'
    exclude 'about.ini'
    exclude 'about.mappings'
    exclude 'about.properties'
    exclude 'modeling32.png'
}

// Make build task depend on shadowJar
build.dependsOn shadowJar
